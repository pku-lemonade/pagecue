name: Native browser feasibility check

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to check
        type: choice
        options: [all, windows-2025, macos-15, macos-15-intel]
        default: all
      patched_windows:
        description: Build the experimental WebView2 shortcut bridge
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_PLUGIN_PATH: ${{ matrix.os == 'windows-2025' && inputs.patched_windows && format('{0}/build/native-webview/plugins', github.workspace) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.target == 'all' && fromJSON('["windows-2025", "macos-15", "macos-15-intel"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.12'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - name: Build experimental WebView2 shortcut bridge
        if: runner.os == 'Windows' && inputs.patched_windows
        run: uv run python scripts/build_native_webview.py
      - name: Decode original H.264 video through the native browser
        run: uv run python scripts/check_native_webview.py --capture --camera-overlay
      - name: Check native Cocoa browser input
        if: runner.os == 'macOS'
        run: uv run --with pyobjc-framework-Cocoa python scripts/check_native_web_keys.py
      - name: Check native Windows browser input
        if: runner.os == 'Windows'
        run: uv run python scripts/check_native_web_keys.py
      - name: Upload browser result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-webview-${{ matrix.os }}
          path: |
            qa/native-webview/result.json
            qa/native-webview/window.png
            qa/native-webkeys/result.json
            build/native-webview/result.json
          if-no-files-found: warn
