name: Native application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installers:
        description: Upload the tested unsigned preview installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.12'
          python-version: '3.13'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Generate original demo deck and QA directory
        run: uv run python scripts/make_demo.py qa/demo.pdf
      - name: Exercise PDF rendering, animations, media, and application logic
        run: uv run pytest -q --junitxml=qa/tests.xml --basetemp=qa/tests
      - name: Check interaction rendering with the native window and font backend
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'cocoa' }}
        run: >-
          uv run pytest tests/test_view_interactions.py tests/test_long_deck.py
          tests/test_pdf_geometry.py tests/test_hci.py
          tests/test_presentations.py::test_space_pauses_timed_page_with_animation_and_menu_resumes
          -vv -s --log-cli-level=INFO -o faulthandler_timeout=30
          --junitxml=qa/native-views.xml --basetemp=qa/native-views
      - name: Exercise Windows Unicode shell links
        if: runner.os == 'Windows'
        run: uv run python scripts/check_windows_shortcut.py
      - name: Check responsive layouts using synthetic camera frames
        run: uv run python scripts/layout_smoke.py qa/demo.pdf qa/layout
      - name: Check file drops, Qt file dialog, file events and recent pages
        run: uv run python scripts/opening_smoke.py qa/demo.pdf qa/opening
      - name: Build native app with bundled Python and Qt
        run: uv run python scripts/build_app.py
      - name: Install, launch, update and remove the actual native package
        run: uv run python scripts/check_bundle.py --output qa/packaged
      - name: Build the platform installer
        run: uv run python scripts/build_installer.py
      - name: Verify the installer artifact
        run: uv run python scripts/check_installer.py --output qa/installer
      - name: Upload tested preview installer
        if: github.event_name == 'workflow_dispatch' && inputs.upload_installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: dist/installers/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}
          path: |
            qa/tests.xml
            qa/tests/test_*/*.png
            qa/tests/test_long_deck_*/result.json
            qa/native-views.xml
            qa/native-views/test_*/*.png
            qa/native-views/test_long_deck_*/result.json
            qa/packaged
            qa/layout
            qa/opening/result.json
            qa/opening/picker.png
            qa/installer
          retention-days: 14
          if-no-files-found: warn
